name: EV3 gripper portable Windows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ev3-gripper.yml'
      - 'EV3_GRIPPER.patch'
      - 'mechanism-assets/**'
      - 'Start-EV3-Gripper.cmd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          msystem: MINGW64
      - name: Install native dependencies
        run: |
          set -euo pipefail
          pacman --noconfirm -S --needed zlib-devel dos2unix rsync unzip mingw-w64-x86_64-libzip mingw-w64-x86_64-libusb mingw-w64-x86_64-zlib mingw-w64-x86_64-pkg-config mingw-w64-x86_64-gdb
      - uses: jurplel/install-qt-action@v4
        with:
          dir: C:\
          version: '5.15.2'
          arch: win64_mingw81
          modules: qtscript
          archives: qtbase qtmultimedia qtsvg qtscript qttools qtserialport qtimageformats qtwinextras qttranslations
          tools: tools_mingw,qt.tools.win64_mingw810
          add-tools-to-path: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/cache/restore@v4
        id: compiled
        with:
          path: |
            studio/
            build/
          key: win-qt5152-gcc81-py311-e045-v1-${{ hashFiles('EV3_GRIPPER.patch', 'mechanism-assets/**') }}
          restore-keys: win-qt5152-gcc81-py311-e045-v1-
      - name: Get the exact source and apply the reviewed patch
        if: steps.compiled.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root=$(cygpath -u "$GITHUB_WORKSPACE")
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          paths = re.findall(r"^\+\+\+ b/(.+)$", (root / "EV3_GRIPPER.patch").read_text(), re.M)
          paths += [str(p.relative_to(root / "studio")) for p in (root / "studio/plugins/robots/common/twoDModel/images/mechanisms").glob("*.png")]
          saved = {}
          for name in paths:
              p = root / "studio" / name
              if p.is_file():
                  st = p.stat()
                  saved[name] = [hashlib.sha256(p.read_bytes()).hexdigest(), st.st_atime_ns, st.st_mtime_ns]
          (root / "cached-source-times.json").write_text(json.dumps(saved))
          PY
          if [ -d "$root/studio/.git" ]; then
            git -C "$root/studio" reset --hard e045db1a187fa59e63ca3575f21253c6c30f8029
            git -C "$root/studio" clean -fd
          else
            git clone --no-checkout https://github.com/trikset/trik-studio.git "$root/studio"
          fi
          git -C "$root/studio" checkout e045db1a187fa59e63ca3575f21253c6c30f8029
          git -C "$root/studio" submodule update --init --recursive --jobs 4
          git -C "$root/studio" apply --check "$root/EV3_GRIPPER.patch"
          git -C "$root/studio" apply "$root/EV3_GRIPPER.patch"
          mkdir -p "$root/studio/plugins/robots/common/twoDModel/images/mechanisms"
          cp "$root/mechanism-assets/"*.png "$root/studio/plugins/robots/common/twoDModel/images/mechanisms/"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          restored = 0
          for name, (digest, atime, mtime) in json.loads((root / "cached-source-times.json").read_text()).items():
              p = root / "studio" / name
              if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() == digest:
                  os.utime(p, ns=(atime, mtime))
                  restored += 1
          print(f"Preserved timestamps for {restored} unchanged patched source files")
          PY
      - name: Build the complete application
        if: steps.compiled.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root=$(cygpath -u "$GITHUB_WORKSPACE")
          mkdir -p "$root/build"
          cd "$root/build"
          qmake "$(cygpath -m "$root/studio/studio.pro")" -spec win32-g++ CONFIG+=release CONFIG+=no-sanitizers CONFIG+=noPch CONFIG+=warn_off "PYTHON_PATH=$pythonLocation" PYTHON_VERSION=3.11
          mingw32-make -j 4 qmake_all
          mingw32-make -j 4 all
      - uses: actions/cache/save@v4
        if: steps.compiled.outputs.cache-hit != 'true'
        with:
          path: |
            studio/
            build/
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Bundle native dependencies
        run: |
          set -euo pipefail
          root=$(cygpath -u "$GITHUB_WORKSPACE")
          test -f "$root/build/bin/trik-studio.exe"
          cp /mingw64/bin/*.dll "$root/build/bin/"
      - name: Bundle Qt with an explicit plugin directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build/bin'
          $qt = $env:QT_ROOT_DIR
          if (-not (Test-Path "$qt/plugins/platforms/qwindows.dll")) { throw 'Qt Windows platform plugin is absent from the SDK.' }
          Copy-Item "$qt/bin/*.dll" $bin -Force
          Copy-Item "$qt/plugins" (Join-Path $bin 'qt-plugins') -Recurse -Force
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw810_64/bin'
          foreach ($dll in @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            Copy-Item (Join-Path $compiler $dll) $bin -Force
          }
          "[Paths]`nPrefix=.`nLibraries=.`nBinaries=.`nPlugins=qt-plugins`nTranslations=translations" | Set-Content (Join-Path $bin 'qt.conf') -Encoding ascii
          if (Test-Path "$qt/translations") { Copy-Item "$qt/translations" $bin -Recurse -Force }
      - name: Bundle Python and the test launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build/bin'
          $runtime = Join-Path $bin 'python-runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item "$env:pythonLocation/Lib" $runtime -Recurse
          Copy-Item "$env:pythonLocation/DLLs" $runtime -Recurse
          Copy-Item "$env:pythonLocation/*.dll" $bin -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Start-EV3-Gripper.cmd') $bin
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'TEST_WINDOWS_RU.md') $bin
      - name: Check that the Windows GUI starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build/bin'
          # Do not let the runner's Qt/Python installations hide missing runtime files.
          $env:PATH = "$bin;$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_DEBUG_PLUGINS = '1'
          $env:TRIK_EV3_GRIPPER_TEST = '1'
          $env:TRIK_PYTHONPATH = "$bin/python-runtime/Lib;$bin/python-runtime/DLLs"
          $process = Start-Process (Join-Path $bin 'trik-studio.exe') -WorkingDirectory $bin -PassThru -RedirectStandardOutput (Join-Path $bin 'startup.stdout.log') -RedirectStandardError (Join-Path $bin 'startup.stderr.log')
          try {
            if (-not $process.WaitForInputIdle(60000)) { throw 'The application did not enter its GUI event loop.' }
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "TRIK Studio exited during startup: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(5000)) { $process.Kill() }
            }
          }
      - name: Diagnose a failed Windows startup
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build/bin'
          $env:PATH = "$bin;$env:SystemRoot/System32;$env:SystemRoot"
          $env:TRIK_EV3_GRIPPER_TEST = '1'
          $env:TRIK_PYTHONPATH = "$bin/python-runtime/Lib;$bin/python-runtime/DLLs"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $debugger = 'C:/msys64/mingw64/bin/gdb.exe'
          if (-not (Test-Path $debugger)) { $debugger = 'D:/a/_temp/msys64/mingw64/bin/gdb.exe' }
          if (Test-Path $debugger) {
            $commands = Join-Path $bin 'startup.gdb'
            @('set pagination off','set confirm off','run','thread apply all bt','info sharedlibrary','quit') | Set-Content $commands
            $debug = Start-Process $debugger -WorkingDirectory $bin -ArgumentList @('-batch','-x','startup.gdb','--args','trik-studio.exe') -PassThru -RedirectStandardOutput (Join-Path $bin 'startup.gdb.log') -RedirectStandardError (Join-Path $bin 'startup.gdb.stderr.log')
            if (-not $debug.WaitForExit(45000)) { taskkill /PID $debug.Id /T /F }
          }
          foreach ($base in @($env:LOCALAPPDATA,$env:APPDATA,$env:TEMP)) {
            Get-ChildItem $base -Filter '*qreal*.log*' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName (Join-Path $bin $_.Name) -Force }
          }
          Get-Content (Join-Path $bin 'startup.gdb.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $bin 'startup.stderr.log') -Tail 80 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TRIK-EV3-packaging-diagnostics
          path: build/bin/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: TRIK-EV3-Mechanisms-Windows-x64
          path: build/bin/
          if-no-files-found: error
          retention-days: 14
